<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Contact Precious Site Academy — We'd love to hear from you." />
  <title>Contact · Precious Site Academy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header" role="banner">
    <div class="logo-title">
      <img src="WhatsApp Image 2025-07-01 at 10.21.11_5353bc8b.jpg" alt="Precious Site Academy logo" class="logo" />
      <h1 class="school-name">Precious Site Academy</h1>
    </div>
    <nav class="navbar" role="navigation" aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="academics.html">Academics</a></li>
        <li><a href="admission.html">Admission</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="content" tabindex="-1">
    <section class="hero">
      <h2>Contact Us</h2>
      <p>We would love to hear from you.</p>
    </section>

    <section class="cards">
      <div class="card">
        <h3>Call Us</h3>
        <p><a href="tel:+254722932869">+254 722 932 869</a></p>
      </div>
      <div class="card">
        <h3>Email Us</h3>
        <p><a href="mailto:info@gmail.com">info@gmail.com</a></p>
      </div>
    </section>

    <section class="section">
      <form id="contact-form" aria-label="Contact form">
        <div class="form-row">
          <label for="name">Your Name</label>
          <input id="name" name="name" type="text" placeholder="Jane Doe" required />
        </div>
        <div class="form-row">
          <label for="email">Your Email</label>
          <input id="email" name="email" type="email" placeholder="jane@example.com" required />
        </div>
        <div class="form-row">
          <label for="message">Your Message</label>
          <textarea id="message" name="message" rows="5" placeholder="How can we help?" required></textarea>
        </div>
        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="footer-links">
      <a href="https://facebook.com/YourPage" target="_blank" rel="noopener noreferrer" aria-label="Facebook">Facebook</a>
      <a href="https://youtube.com/YourChannel" target="_blank" rel="noopener noreferrer" aria-label="YouTube">YouTube</a>
      <a href="https://tiktok.com/@YourHandle" target="_blank" rel="noopener noreferrer" aria-label="TikTok">TikTok</a>
      <a href="https://wa.me/254712345678" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">WhatsApp</a>
    </div>
    <p>&copy; 2025 Precious Site Academy · Designed by Stephen Ikumbu</p>
  </footer>

  <script src="main.js" defer></script>
</body>
</html>
